name: Build and Deploy EdgeSenseAI Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend-image.yml"
      - "scripts/smoke_test_platform.sh"

permissions:
  contents: read

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: edgesenseai-rg
  LOCATION: centralus
  ALLOW_REUSE_NON_CENTRALUS_ENV: "false"
  ACR_LOGIN_SERVER: opsenseaiacrbuild.azurecr.io
  IMAGE_NAME: edgesenseai-backend
  IMAGE_TAG: dev
  CONTAINER_APP_ENV: edgesenseai-env
  CONTAINER_APP_NAME: edgesenseai-backend
  CONTAINER_PORT: "8900"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            echo "Missing GitHub secret: ACR_USERNAME"
            missing=1
          fi

          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "Missing GitHub secret: ACR_PASSWORD"
            missing=1
          fi

          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "Missing GitHub secret: AZURE_CREDENTIALS"
            missing=1
          fi

          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "Missing GitHub secret: DATABASE_URL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Add missing secrets in GitHub repo: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.prod.txt"

      - name: Validate backend production imports
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.prod.txt
          python - <<'PY'
          import fastapi
          import uvicorn
          import pandas
          import numpy
          import xgboost
          print("core production imports ok")
          import app.main
          print("app.main import ok")
          PY

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate AZURE_CREDENTIALS shape
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          raw = os.environ.get("AZURE_CREDENTIALS", "")
          if not raw:
              raise SystemExit("AZURE_CREDENTIALS is empty")
          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"AZURE_CREDENTIALS is not valid JSON: {e}")
          required = ["clientSecret", "subscriptionId", "tenantId", "clientId"]
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit(f"AZURE_CREDENTIALS missing keys: {missing}")
          print("AZURE_CREDENTIALS shape ok")
          PY
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure login
        shell: bash
        run: |
          az account show --query "{name:name, subscriptionId:id, tenantId:tenantId}" -o json

      - name: Ensure Azure Container Apps extension
        shell: bash
        run: |
          az extension add --name containerapp --upgrade

      - name: Ensure resource group exists
        shell: bash
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION"

      - name: Ensure Container Apps environment exists
        shell: bash
        run: |
          echo "Existing Container Apps environments:"
          az containerapp env list \
            --query "[].{name:name, resourceGroup:resourceGroup, location:location, id:id}" \
            -o table || true

          ENV_MATCHES_JSON="$(az containerapp env list \
            --query "[?name=='${CONTAINER_APP_ENV}'].{name:name, resourceGroup:resourceGroup, location:location, id:id}" \
            -o json)"
          export ENV_MATCHES_JSON

          CENTRALUS_ENV_ID="$(python - <<'PY'
          import json, os
          target = os.environ["LOCATION"].lower()
          for env in json.loads(os.environ.get("ENV_MATCHES_JSON") or "[]"):
              if (env.get("location") or "").lower() == target:
                  print(env.get("id") or "")
                  break
          PY
          )"

          FIRST_ENV_ID="$(python - <<'PY'
          import json, os
          matches = json.loads(os.environ.get("ENV_MATCHES_JSON") or "[]")
          print((matches[0] if matches else {}).get("id") or "")
          PY
          )"

          if [ -n "$CENTRALUS_ENV_ID" ]; then
            echo "Reusing Container Apps environment in ${LOCATION}: $CONTAINER_APP_ENV"
            echo "CONTAINER_APP_ENV_REF=$CENTRALUS_ENV_ID" >> "$GITHUB_ENV"
          elif [ -n "$FIRST_ENV_ID" ] && [ "${ALLOW_REUSE_NON_CENTRALUS_ENV,,}" = "true" ]; then
            echo "Reusing non-centralus Container Apps environment because ALLOW_REUSE_NON_CENTRALUS_ENV=true."
            echo "CONTAINER_APP_ENV_REF=$FIRST_ENV_ID" >> "$GITHUB_ENV"
          else
            echo "Creating Container Apps environment in ${LOCATION}: $CONTAINER_APP_ENV"
            if ! az containerapp env create \
              --name "$CONTAINER_APP_ENV" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION"; then
              echo "Existing Container Apps environment is not in centralus. Delete the old environment or set ALLOW_REUSE_NON_CENTRALUS_ENV=true."
              exit 1
            fi
            ENV_ID="$(az containerapp env show \
              --name "$CONTAINER_APP_ENV" \
              --resource-group "$RESOURCE_GROUP" \
              --query id \
              -o tsv)"
            echo "CONTAINER_APP_ENV_REF=$ENV_ID" >> "$GITHUB_ENV"
          fi

      - name: Create or update backend Container App
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

          if az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating Container App image: $CONTAINER_APP_NAME"
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                ENVIRONMENT=production \
                APP_ENV=production \
                PAPER_TRADING_ENABLED=true \
                LIVE_TRADING_ENABLED=false \
                BROKER_EXECUTION_ENABLED=false \
                REQUIRE_HUMAN_APPROVAL=true \
                MARKET_DATA_MODE=provider \
                MARKET_DATA_PROVIDER=yfinance \
                MARKET_DATA_PROVIDER_PRIORITY=polygon,alpaca,yfinance \
                ALLOW_NON_REAL_MARKET_DATA=false \
                ALLOW_SYNTHETIC_MARKET_DATA=false \
                QLIB_REQUIRED=false \
                DATABASE_URL="$DATABASE_URL"
          else
            echo "Creating Container App: $CONTAINER_APP_NAME"
            az containerapp create \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENV_REF" \
              --image "$IMAGE" \
              --target-port "$CONTAINER_PORT" \
              --ingress external \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --min-replicas 0 \
              --max-replicas 1 \
              --env-vars \
                ENVIRONMENT=production \
                APP_ENV=production \
                PAPER_TRADING_ENABLED=true \
                LIVE_TRADING_ENABLED=false \
                BROKER_EXECUTION_ENABLED=false \
                REQUIRE_HUMAN_APPROVAL=true \
                MARKET_DATA_MODE=provider \
                MARKET_DATA_PROVIDER=yfinance \
                MARKET_DATA_PROVIDER_PRIORITY=polygon,alpaca,yfinance \
                ALLOW_NON_REAL_MARKET_DATA=false \
                ALLOW_SYNTHETIC_MARKET_DATA=false \
                QLIB_REQUIRED=false \
                DATABASE_URL="$DATABASE_URL"
          fi

      - name: Sync scheduled worker jobs to same image as API
        shell: bash
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          for JOB in edgesenseai-market-scan-job edgesenseai-data-ingest-job edgesenseai-feature-pipe-job; do
            if az containerapp job show --name "$JOB" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "Updating worker job $JOB -> $IMAGE"
              az containerapp job update \
                --name "$JOB" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE"
            else
              echo "Worker job $JOB not found in $RESOURCE_GROUP; create it with scripts/azure-create-workers.sh"
            fi
          done

      - name: Show Container App URL and image
        shell: bash
        run: |
          echo "Deployed image:"
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv

          echo "FQDN:"
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv

      - name: Optional health check
        shell: bash
        env:
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          if [ -z "$BACKEND_PUBLIC_URL" ]; then
            echo "Skipping health check because BACKEND_PUBLIC_URL is not configured."
            exit 0
          fi

          curl -fsS "$BACKEND_PUBLIC_URL/health"
