name: Build EdgeSenseAI Backend Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend-image.yml"

env:
  ACR_LOGIN_SERVER: opsenseaiacrbuild.azurecr.io
  IMAGE_NAME: edgesenseai-backend
  IMAGE_TAG: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate required ACR secrets
        run: |
          missing=0
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            echo "Missing GitHub secret: ACR_USERNAME"
            missing=1
          fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "Missing GitHub secret: ACR_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            ./backend

      - name: Push backend image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
